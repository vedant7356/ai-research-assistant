spring.application.name=research-assistant
server.port=8080

# --- Database (override with environment variables; see ../.env.example) ---
# Homebrew PostgreSQL creates a role named after your macOS user with no password,
# so the defaults below work on a fresh local install.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/research_assistant}
spring.datasource.username=${DB_USERNAME:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

# Let Hibernate create/update tables from the entities (fine for a student project).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Upload limit (PDFs). Mirrored in the frontend later.
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Optionally load secrets/config from the repo-root .env file (KEY=VALUE lines).
# mvn spring-boot:run runs inside backend/, hence ../.env. Missing file is fine.
spring.config.import=optional:file:../.env[.properties]

# --- Paper search (OpenAlex) ---
openalex.base-url=https://api.openalex.org
openalex.api-key=${OPENALEX_API_KEY:}

llm.base-url=${LLM_BASE_URL:}
llm.api-key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:}
