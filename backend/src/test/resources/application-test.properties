# Homework 2 test profile. Activate with @ActiveProfiles("test").
# In-memory H2 instead of PostgreSQL; fake LLM/OpenAlex endpoints so tests can never
# hit the real services or use a real API key from .env.
# NON_KEYWORDS=YEAR: "year" is a reserved word in H2 2.x but a normal column name in PostgreSQL.
spring.datasource.url=jdbc:h2:mem:researchtest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

llm.base-url=http://localhost:1
llm.api-key=test-key
llm.model=test-model
openalex.base-url=http://localhost:1
openalex.api-key=
